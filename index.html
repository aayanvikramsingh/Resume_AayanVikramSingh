<style>
  :root {
    --ink:      #0F1D2A;
    --paper:    #EDF1F5;
    --rule:     #C6D2DE;
    --accent:   #1F4FD8;
    --muted:    #5B6B7C;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background-color: var(--paper);
    /* blueprint grid — quiet, and honest to an engineering résumé */
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    line-height: 1.55;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(237,241,245,0) 0%, var(--paper) 78%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    max-width: 60rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.25rem;
  }

  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2.75rem, 11vw, 6.5rem);
    line-height: 0.92;
    letter-spacing: -0.035em;
    margin: 0 0 1.5rem;
  }

  h1 .given { display: block; }
  h1 .family { display: block; color: var(--accent); }

  .standfirst {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: clamp(1rem, 2.4vw, 1.35rem);
    font-weight: 400;
    max-width: 34rem;
    margin: 0 0 2.5rem;
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.75rem;
  }

  .btn {
    display: inline-block;
    padding: 0.85rem 1.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-decoration: none;
    border: 1.5px solid var(--ink);
    transition: transform 0.12s ease, background-color 0.12s ease, color 0.12s ease;
  }

  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-secondary { background: transparent; color: var(--ink); }

  .btn:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--accent); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .meta {
    font-size: 0.8125rem;
    color: var(--muted);
    margin: 0 0 3.5rem;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1.5px solid var(--ink);
    font-size: 0.875rem;
  }

  .links a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 2px;
  }

  .links a:hover { color: var(--accent); }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 48rem) {
    .wrap { padding-top: 3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
